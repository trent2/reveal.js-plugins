<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>reveal-probability / reveal-uncover / reveal-layouts tests</title>
<base href="../">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.css">
<link rel="stylesheet" href="reveal-uncover.css">
<link rel="stylesheet" href="reveal-probability.css">
<link rel="stylesheet" href="reveal-layouts.css">
</head>
<body>
<!-- Unit tests build their fixtures here, outside of reveal.js -->
<div id="scratch"></div>

<!-- Integration test with the real reveal.js -->
<div class="reveal" id="integration" style="height:300px"><div class="slides"><section>
  <span class="uncover" id="i-a">a</span> <span class="uncover" id="i-b">b</span>
  <div class="venn" id="i-venn" data-mode="union" data-left-only="1" data-both="2" data-right-only="3"></div>
  <div class="fourfield" id="i-ff" data-columns="a|b" data-rows="c|d" data-values="?1|2|3 ; 4|5|6 ; 7|8|9"></div>
</section></div></div>

<pre id="result"></pre>

<script src="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.js"></script>
<script src="reveal-uncover.js"></script>
<script src="reveal-probability.js"></script>
<script>
(() => {
  'use strict';

  // ---------- Mini harness ----------
  const results = [];
  let warnings = [];
  const nativeWarn = console.warn;
  console.warn = (...args) => { warnings.push(args.filter(a => typeof a === 'string').join(' ')); };

  const assert = (condition, message) => { if (!condition) throw new Error(message || 'assertion failed'); };
  const eq = (actual, expected, message = '') =>
    assert(JSON.stringify(actual) === JSON.stringify(expected),
           `${message} expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`.trim());
  const near = (actual, expected, message = '') =>
    assert(Math.abs(actual - expected) < 1e-6, `${message} expected ${expected}, got ${actual}`.trim());

  function test(name, fn) {
    warnings = [];
    try { fn(); results.push({ name, ok: true }); }
    catch (e) { results.push({ name, ok: false, error: String(e.message || e) }); }
  }
  async function testAsync(name, fn) {
    warnings = [];
    try { await fn(); results.push({ name, ok: true }); }
    catch (e) { results.push({ name, ok: false, error: String(e.message || e) }); }
  }

  const $ = (root, selector) => root.querySelector(selector);
  const $$ = (root, selector) => [...root.querySelectorAll(selector)];
  const text = el => el.textContent;

  // ---------- Fixtures ----------
  function container(html) {
    const host = document.createElement('div');
    host.innerHTML = html;
    document.getElementById('scratch').append(host);
    return host;
  }
  // Initialise a plugin on a fake deck whose reveal element is `root`
  function probabilityOn(root, config = {}) {
    const plugin = RevealProbability();
    plugin.init({ getConfig: () => ({ probability: config }), getRevealElement: () => root });
    return plugin;
  }
  function uncoverOn(root, config = {}, currentSlide = root) {
    const bindings = [], shortcuts = [];
    const plugin = RevealUncover();
    plugin.init({
      getConfig: () => ({ uncover: config }),
      getRevealElement: () => root,
      getCurrentSlide: () => currentSlide,
      addKeyBinding: (binding, callback) => bindings.push({ binding, callback }),
      registerKeyboardShortcut: (keys, description) => shortcuts.push({ keys, description })
    });
    return { plugin, bindings, shortcuts };
  }
  const shiftKey = (key, target = document, extra = {}) =>
    target.dispatchEvent(new KeyboardEvent('keydown', { key, shiftKey: true, bubbles: true, ...extra }));
  // Build one diagram from markup and return its host element
  function build(html, config) {
    const root = container(html);
    probabilityOn(root, config);
    return root.firstElementChild;
  }
  const venn = (attributes = '', config) => build(`<div class="venn" ${attributes}></div>`, config);
  const tree = (attributes = '', config) => build(`<div class="tree" ${attributes}></div>`, config);
  const fourfield = (attributes = '', config) => build(`<div class="fourfield" ${attributes}></div>`, config);

  const fillKinds = host => $$(host, '.venn-fill').map(el => [...el.classList].find(c => c.startsWith('venn-fill-')).slice(10));
  const labelsOf = (host, selector) => $$(host, selector).map(text);
  const center = el => [Number(el.getAttribute('cx')), Number(el.getAttribute('cy'))];

  // Region geometry, same numbers as the plugin
  const dl = (x, y) => Math.hypot(x - 215, y - 180) - 125;
  const dr = (x, y) => Math.hypot(x - 345, y - 180) - 125;
  const IN_REGION = {
    leftOnly:  (x, y) => dl(x, y) < 0 && dr(x, y) > 0,
    both:      (x, y) => dl(x, y) < 0 && dr(x, y) < 0,
    rightOnly: (x, y) => dr(x, y) < 0 && dl(x, y) > 0,
    outside:   (x, y) => dl(x, y) > 0 && dr(x, y) > 0 && x > 10 && x < 550 && y > 10 && y < 350
  };
  const ATTRIBUTE = { leftOnly: 'data-left-only', both: 'data-both', rightOnly: 'data-right-only', outside: 'data-outside' };
  const range = (from, to) => Array.from({ length: to - from + 1 }, (_, i) => from + i);

  // ======================================================================
  // reveal-uncover
  // ======================================================================
  test('uncover: elements present at init start covered', () => {
    const root = container('<span class="uncover">a</span><span class="uncover block">b</span>');
    uncoverOn(root);
    eq($$(root, '.uncover.covered').length, 2);
  });

  test('uncover: click toggles one element only', () => {
    const root = container('<span class="uncover">a</span><span class="uncover">b</span>');
    uncoverOn(root);
    const [a, b] = $$(root, '.uncover');
    a.click();
    assert(!a.classList.contains('covered') && b.classList.contains('covered'), 'a uncovered, b covered');
    a.click();
    assert(a.classList.contains('covered'), 'covered again');
  });

  test('uncover: click on a child element toggles the uncover ancestor', () => {
    const root = container('<span class="uncover"><b>x</b></span>');
    uncoverOn(root);
    $(root, 'b').click();
    eq($$(root, '.uncover.covered').length, 0);
  });

  test('uncover: clicks outside of uncover elements do nothing', () => {
    const root = container('<p id="p">text</p><span class="uncover">a</span>');
    uncoverOn(root);
    $(root, '#p').click();
    eq($$(root, '.uncover.covered').length, 1);
  });

  test('uncover: works for SVG descendants', () => {
    const root = container('<span class="uncover"><svg viewBox="0 0 10 10"><circle id="c" r="3"/></svg></span>');
    uncoverOn(root);
    $(root, '#c').dispatchEvent(new MouseEvent('click', { bubbles: true }));
    eq($$(root, '.uncover.covered').length, 0);
  });

  test('uncover: API cover/uncover act on the given scope only', () => {
    const root = container('<div id="s1"><span class="uncover">a</span></div><div id="s2"><span class="uncover">b</span></div>');
    const { plugin } = uncoverOn(root);
    plugin.uncover(root);
    eq($$(root, '.covered').length, 0, 'all uncovered');
    plugin.cover($(root, '#s1'));
    eq([$$(root, '#s1 .covered').length, $$(root, '#s2 .covered').length], [1, 0]);
    plugin.uncover($(root, '#s1'));
    eq($$(root, '.covered').length, 0);
  });

  test('uncover: API toggle', () => {
    const root = container('<span class="uncover">a</span>');
    const { plugin } = uncoverOn(root);
    const el = $(root, '.uncover');
    plugin.toggle(el);
    assert(!el.classList.contains('covered'));
    plugin.toggle(el);
    assert(el.classList.contains('covered'));
  });

  test('uncover: elements added later start uncovered but react to clicks and cover()', () => {
    const root = container('');
    const { plugin } = uncoverOn(root);
    root.innerHTML = '<span class="uncover">late</span>';
    const el = $(root, '.uncover');
    assert(!el.classList.contains('covered'));
    plugin.cover(root);
    assert(el.classList.contains('covered'));
    el.click();
    assert(!el.classList.contains('covered'));
  });

  const slides = '<div id="s1"><span class="uncover">a</span></div><div id="s2"><span class="uncover">b</span></div>';
  const coveredIds = root => $$(root, '.covered').map(el => el.parentNode.id);

  test('uncover: default bindings U and V act on the current slide', () => {
    const root = container(slides);
    const { bindings } = uncoverOn(root, {}, $(root, '#s1'));
    eq(bindings.map(b => [b.binding.keyCode, b.binding.key]), [[85, 'U'], [86, 'V']]);
    eq(bindings.map(b => b.binding.description), ['Uncover all solutions on this slide', 'Cover all solutions on this slide']);
    bindings[0].callback();
    eq(coveredIds(root), ['s2'], 'U uncovers slide 1 only');
    bindings[1].callback();
    eq(coveredIds(root), ['s1', 's2'], 'V covers slide 1 again');
  });

  test('uncover: Shift+U and Shift+V act on the whole presentation', () => {
    const root = container(slides);
    const { shortcuts } = uncoverOn(root, {}, $(root, '#s1'));
    eq(shortcuts.map(s => s.keys), ['Shift + U', 'Shift + V']);
    shiftKey('U');
    eq(coveredIds(root), [], 'everything uncovered');
    shiftKey('v');
    eq(coveredIds(root), ['s1', 's2'], 'everything covered');
  });

  test('uncover: Shift keys ignore other modifiers and text fields', () => {
    const root = container(slides + '<input id="in">');
    uncoverOn(root);
    shiftKey('U', document, { ctrlKey: true });
    shiftKey('U', $(root, '#in'));
    document.dispatchEvent(new KeyboardEvent('keydown', { key: 'U', bubbles: true }));   // no Shift
    eq($$(root, '.covered').length, 2);
  });

  test('uncover: configured keys and descriptions', () => {
    const root = container(slides);
    const { bindings, shortcuts } = uncoverOn(root, {
      keys: { uncoverSlide: 'x', coverAll: 'Shift+y' },
      descriptions: { uncoverSlide: 'Aufdecken', coverAll: 'Alle verdecken' }
    });
    eq(bindings.filter(b => b.binding.key === 'X').map(b => [b.binding.keyCode, b.binding.description]), [[88, 'Aufdecken']]);
    eq(shortcuts.filter(s => s.keys === 'Shift + Y').map(s => s.description), ['Alle verdecken']);
    shiftKey('U');
    eq($$(root, '.covered').length, 0, 'default Shift+U still works');
  });

  test('uncover: key false registers no binding', () => {
    const { bindings, shortcuts } = uncoverOn(container(''), {
      keys: { uncoverSlide: false, uncoverAll: false, coverSlide: false, coverAll: false } });
    eq([bindings.length, shortcuts.length], [0, 0]);
    const root = container(slides);
    uncoverOn(root, { keys: { uncoverAll: false } });
    shiftKey('U');
    eq($$(root, '.covered').length, 2, 'disabled key does nothing');
  });

  test('uncover: listener is bound to the reveal element only', () => {
    const outside = container('<span class="uncover">o</span>');
    uncoverOn(container('<span class="uncover">i</span>'));
    $(outside, '.uncover').click();
    assert(!$(outside, '.uncover').classList.contains('covered'));
  });

  // ======================================================================
  // reveal-probability: Venn diagram
  // ======================================================================
  test('venn: default structure', () => {
    const host = venn();
    eq($$(host, 'svg').length, 1);
    eq($(host, 'svg').getAttribute('viewBox'), '0 0 560 360');
    eq($(host, 'svg').getAttribute('aria-label'), 'Venn diagram');
    eq(labelsOf(host, '.venn-name'), ['A', 'B']);
    eq(labelsOf(host, '.venn-universe-label'), ['S']);
    eq([$$(host, '.venn-circle-1').length, $$(host, '.venn-circle-2').length, $$(host, '.venn-frame').length], [1, 1, 1]);
    eq($$(host, '.venn-element').length, 0);
    eq(warnings, []);
  });

  const FILLS = {
    none:         ['blank'],
    complement:   ['blank', 'highlight', 'blank'],
    intersection: ['blank', 'highlight'],
    union:        ['blank', 'highlight', 'highlight'],
    difference:   ['blank', 'highlight', 'blank'],
    partition:    ['blank', 'outside', 'left', 'right', 'both'],
    probability:  ['blank', 'outside', 'left', 'right', 'both']
  };
  for (const [mode, kinds] of Object.entries(FILLS))
    test(`venn: mode ${mode} paints the expected layers`, () => {
      eq(fillKinds(venn(`data-mode="${mode}"`)), kinds);
    });

  test('venn: default mode is none', () => {
    eq(fillKinds(venn()), FILLS.none);
  });

  test('venn: clipped layers reference an existing clipPath, ids are unique', () => {
    const a = venn('data-mode="intersection"'), b = venn('data-mode="partition"');
    const clipped = [...$$(a, '[clip-path]'), ...$$(b, '[clip-path]')];
    eq(clipped.length, 2);
    for (const el of clipped) {
      const id = /url\(#(.+)\)/.exec(el.getAttribute('clip-path'))[1];
      assert(document.getElementById(id), `clipPath ${id} exists`);
    }
    const ids = [...$$(a, 'clipPath'), ...$$(b, 'clipPath')].map(el => el.id);
    eq(new Set(ids).size, 2, 'unique ids');
  });

  const ELEMENTS = 'data-left-only="1,2" data-both="3" data-right-only="4" data-outside="5"';
  const HIGHLIGHTED = {
    none: [], partition: [], probability: [],
    complement: ['4', '5'], intersection: ['3'], union: ['1', '2', '3', '4'], difference: ['1', '2']
  };
  for (const [mode, expected] of Object.entries(HIGHLIGHTED))
    if (mode !== 'probability')
      test(`venn: mode ${mode} highlights elements ${JSON.stringify(expected)}`, () => {
        const host = venn(`data-mode="${mode}" ${ELEMENTS}`);
        eq(labelsOf(host, '.venn-element-label.venn-element-highlighted').sort(), expected);
        eq($$(host, '.venn-element').length, 5);
        eq($$(host, '.venn-element-highlighted').length, expected.length * 2, 'circle and label are marked');
      });

  test('venn: mode probability draws values instead of elements', () => {
    const host = venn(`data-mode="probability" data-values="0,1 | 0,15|0,05|0,7" ${ELEMENTS}`);
    eq(labelsOf(host, '.venn-value'), ['0,1', '0,15', '0,05', '0,7']);
    eq($$(host, '.venn-element').length, 0);
  });

  test('venn: surplus values are ignored, missing values leave regions empty', () => {
    eq(labelsOf(venn('data-mode="probability" data-values="1|2|3|4|5"'), '.venn-value'), ['1', '2', '3', '4']);
    eq(labelsOf(venn('data-mode="probability" data-values="1|2"'), '.venn-value'), ['1', '2']);
    eq(labelsOf(venn('data-mode="probability"'), '.venn-value'), []);
  });

  test('venn: names from data-names', () => {
    eq(labelsOf(venn('data-names="I, V"'), '.venn-name'), ['I', 'V']);
  });

  test('venn: wrong number of names warns and falls back to A,B', () => {
    const host = venn('data-names="X"');
    eq(labelsOf(host, '.venn-name'), ['A', 'B']);
    eq(warnings.length, 1);
    assert(warnings[0].includes('[reveal-probability]'));
  });

  test('venn: mini draws only circles and colours', () => {
    const host = build('<div class="venn mini" data-mode="union" data-left-only="1"></div>');
    eq([$$(host, 'text').length, $$(host, '.venn-element').length], [0, 0]);
    eq(fillKinds(host), FILLS.union);
    eq($$(host, '.venn-circle').length, 2);
  });

  test('venn: unknown mode warns and behaves like none', () => {
    const host = venn('data-mode="foo"');
    eq(fillKinds(host), FILLS.none);
    eq(warnings.length, 1);
    assert(warnings[0].includes('foo') && warnings[0].includes('partition'), 'names the mode and the allowed ones');
  });

  test('venn: aria-label from configuration, escaped', () => {
    eq($(venn('', { labels: { venn: 'Mengen "A"' } }), 'svg').getAttribute('aria-label'), 'Mengen "A"');
  });

  test('venn: labels are escaped, no markup injection', () => {
    const host = venn('data-mode="none" data-names="&lt;i&gt;,B" data-left-only="a&lt;b&gt;x&lt;/b&gt;"');
    eq($$(host, 'i, b').length, 0);
    eq(labelsOf(host, '.venn-name')[0], '<i>');
    eq(labelsOf(host, '.venn-element-label'), ['a<b>x</b>']);
  });

  // ---- automatic placement ----
  for (const region of Object.keys(ATTRIBUTE))
    test(`venn: automatic placement keeps elements inside region ${region}`, () => {
      const host = venn(`${ATTRIBUTE[region]}="${range(1, 3).join(',')}"`);
      const circles = $$(host, '.venn-element');
      eq(circles.length, 3);
      for (const c of circles) {
        const [x, y] = center(c);
        assert(IN_REGION[region](x, y), `(${x},${y}) lies in ${region}`);
        near(Number(c.getAttribute('r')), 14, 'radius');
      }
    });

  test('venn: automatic placement - 12 elements in rightOnly stay inside and do not overlap', () => {
    const host = venn(`data-right-only="${range(1, 12).join(',')}"`);
    const points = $$(host, '.venn-element').map(center);
    eq(points.length, 12);
    for (const [x, y] of points) {
      assert(IN_REGION.rightOnly(x, y), 'inside');
      assert(dr(x, y) <= -14 && dl(x, y) >= 14, 'does not touch a circle line');
    }
    for (let i = 0; i < points.length; i++)
      for (let j = i + 1; j < points.length; j++)
        assert(Math.hypot(points[i][0] - points[j][0], points[i][1] - points[j][1]) >= 28, `elements ${i},${j} do not overlap`);
    eq(warnings, []);
  });

  test('venn: automatic placement - all four regions at once do not overlap', () => {
    const host = venn('data-left-only="1,2,3,4,5" data-both="6,7,8" data-right-only="9,10,11,12,13,14" data-outside="15,16,17,18,19,20"');
    const points = $$(host, '.venn-element').map(center);
    eq(points.length, 20);
    for (let i = 0; i < points.length; i++)
      for (let j = i + 1; j < points.length; j++)
        assert(Math.hypot(points[i][0] - points[j][0], points[i][1] - points[j][1]) >= 28, `elements ${i},${j} do not overlap`);
  });

  test('venn: outside elements keep away from the labels', () => {
    const host = venn(`data-outside="${range(1, 6).join(',')}"`);
    for (const [x, y] of $$(host, '.venn-element').map(center))
      for (const [lx, ly] of [[92, 90], [468, 90], [532, 340]])
        assert(Math.hypot(x - lx, y - ly) > 40, 'clear of label');
  });

  test('venn: too many elements warn and are not drawn', () => {
    const host = venn(`data-right-only="${range(1, 40).join(',')}"`);
    eq($$(host, '.venn-element').length, 0);
    eq(warnings.length, 1);
  });

  test('venn: element order follows the attribute (placement is deterministic)', () => {
    const a = $$(venn('data-both="1,2,3"'), '.venn-element').map(center);
    const b = $$(venn('data-both="1,2,3"'), '.venn-element').map(center);
    eq(a, b);
  });

  // ---- sets ----
  const SET = {
    names: ['I', 'V'],
    leftOnly: [1, 2], both: [3], rightOnly: [4], outside: [5],
    positions: { 1: [100, 100], 2: [120, 140], 3: [280, 180], 4: [410, 180], 5: [50, 300] }
  };
  test('venn: set supplies names, elements and exact positions', () => {
    const host = venn('data-mode="union" data-set="s"', { sets: { s: SET } });
    eq(labelsOf(host, '.venn-name'), ['I', 'V']);
    const placed = Object.fromEntries($$(host, '.venn-element').map(c => [text(c.nextElementSibling), center(c)]));
    eq(placed, { 1: [100, 100], 2: [120, 140], 3: [280, 180], 4: [410, 180], 5: [50, 300] });
    eq(labelsOf(host, '.venn-element-label.venn-element-highlighted').sort(), ['1', '2', '3', '4']);
  });

  test('venn: data-names beats the names of the set', () => {
    eq(labelsOf(venn('data-set="s" data-names="X,Y"', { sets: { s: SET } }), '.venn-name'), ['X', 'Y']);
  });

  test('venn: explicit region attribute beats the set, other regions stay', () => {
    const host = venn('data-set="s" data-left-only="a"', { sets: { s: SET } });
    eq(labelsOf(host, '.venn-element-label').sort(), ['3', '4', '5', 'a']);
  });

  test('venn: region without complete positions is placed automatically', () => {
    const partial = { ...SET, positions: { 1: [100, 100] } };         // 2 has no position
    const host = venn('data-set="s"', { sets: { s: partial } });
    const left = $$(host, '.venn-element').filter(c => ['1', '2'].includes(text(c.nextElementSibling)));
    eq(left.length, 2);
    for (const c of left) assert(IN_REGION.leftOnly(...center(c)), 'auto placed inside leftOnly');
  });

  test('venn: unknown set warns, diagram is still drawn', () => {
    const host = venn('data-set="nope"');
    eq($$(host, 'svg').length, 1);
    eq(warnings.length, 1);
    assert(warnings[0].includes('nope'));
  });

  test('venn: set labels can be numbers', () => {
    eq(labelsOf(venn('data-set="s"', { sets: { s: { leftOnly: [7] } } }), '.venn-element-label'), ['7']);
  });

  // ======================================================================
  // reveal-probability: tree diagram
  // ======================================================================
  const TREE = 'data-names="A,B" data-probabilities="1/6|5/6 ; 1/3|2/3 ; 4/5|1/5"';
  test('tree: structure', () => {
    const host = tree(TREE);
    eq($(host, 'svg').getAttribute('aria-label'), 'Tree diagram');
    eq($$(host, '.tree-branch').length, 6);
    eq($$(host, '.tree-node').length, 6);
    eq([$$(host, '.tree-node.tree-node-1').length, $$(host, '.tree-node.tree-node-2').length], [2, 4]);
    eq(labelsOf(host, '.tree-node-label'), ['A', 'A', 'B', 'B', 'B', 'B']);
    eq($$(host, '.tree-overline').length, 3, 'one complement on stage 1, two on stage 2');
    eq(warnings, []);
  });

  test('tree: own names for the complements replace the overlines', () => {
    const host = tree('data-names="♂,D" data-complement-names="♀,R" data-probabilities="1|2 ; 3|4 ; 5|6"');
    eq(labelsOf(host, '.tree-node-label'), ['♂', '♀', 'D', 'R', 'D', 'R']);
    eq($$(host, '.tree-overline').length, 0);
    eq(warnings, []);
  });

  test('tree: an empty complement name keeps the overline for that stage', () => {
    const host = tree('data-names="♂,D" data-complement-names=",R" data-probabilities="1|2 ; 3|4 ; 5|6"');
    eq(labelsOf(host, '.tree-node-label'), ['♂', '♂', 'D', 'R', 'D', 'R']);
    eq($$(host, '.tree-overline').length, 1, 'only the stage 1 complement');
  });

  test('tree: path probabilities below the end nodes', () => {
    const host = tree('data-probabilities="1|2 ; 3|4 ; 5|6" data-paths="0,1|1/4|?0,3|0,2"');
    eq(labelsOf(host, '.tree-probability').slice(-5), ['0,1', '1', '4', '0,3', '0,2']);
    eq($$(host, '.tree-fraction-bar').length, 1);
    eq($$(host, 'g.uncover').length, 1);
    const first = $$(host, '.tree-probability')[6];
    assert(Number(first.getAttribute('y')) > 215 + 18, 'below the node');
    eq(Number(first.getAttribute('x')), Number($$(host, '.tree-node.tree-node-2')[0].getAttribute('cx')));
    eq(warnings, []);
  });

  test('tree: without data-paths the drawing keeps its height', () => {
    eq($(tree(TREE), 'svg').getAttribute('viewBox'), '0 0 460 245');
  });

  test('tree: data-paths needs four values', () => {
    const host = tree('data-probabilities="1|2 ; 3|4 ; 5|6" data-paths="1|2|3"');
    eq($$(host, 'svg').length, 0);

      assert(outro.getBoundingClientRect().top >= first.bottom - 1, `${template}: outro below the columns`);

    eq(columns(el).length, 2);
    eq(columns(el)[1], '440px');
    el.style.setProperty('--layout-aside-width', '200px');
    eq(columns(el)[1], '200px');
    const plain = slide('layout-task-aside', '<h2>T</h2><div class="task">a</div><div class="visual">b</div>');
    assert(parseFloat(css($(plain, '.visual'), 'fontSize')) > parseFloat(css($(plain, '.task'), 'fontSize')), '.visual keeps the normal type size');
  });

  test('layouts: layout-task is a column; the heading keeps its size, the rest is small', () => {
    const el = slide('layout-task', '<h2>T</h2><div class="layout-box">b</div><div><p class="part">a)</p></div>');
    eq(css(el, 'flexDirection'), 'column');
    assert(parseFloat(css($(el, '.layout-box'), 'fontSize')) < parseFloat(css($(el, 'h2'), 'fontSize')), 'text smaller than heading');
    eq(css($(el, '.part'), 'fontWeight'), '600');
  });

  test('layouts: layout-task: a box directly in the slide has the task size, items are 10px apart, no gap below the heading', () => {
    const el = slide('layout-task', '<h2>T</h2><div class="layout-box">b</div><div id="x">x</div><div id="y">y</div>');
    const task = parseFloat(css(el, 'fontSize')) * .6 + 'px';
    eq(css($(el, '.layout-box'), 'fontSize'), task, 'task size (.6em of the slide)');
    eq([css($(el, '.layout-box'), 'marginTop'), css($(el, '#x'), 'marginTop'), css($(el, '#y'), 'marginTop')], ['0px', '10px', '10px']);
    const nested = slide('layout-task', '<div><div class="layout-box">b</div></div>');
    eq(css($(nested, '.layout-box'), 'fontSize'), task, 'a nested box is not scaled twice');
  });

  test('layouts: .item has a label column', () => {
    const el = slide('layout-task', '<div class="item"><span class="label">(1)</span><div>x</div></div>');
    eq(columns($(el, '.item')).length, 2);
    $(el, '.item').style.setProperty('--layout-label-width', '100px');
    eq(columns($(el, '.item'))[0], '100px');
  });

  test('layouts: title and section templates use the light text colour', () => {
    eq(css($(slide('layout-title', '<h1>T</h1>'), 'h1'), 'color'), 'rgb(255, 255, 255)');
    eq(css($(slide('layout-section', '<h1>T</h1><p>s</p>'), 'p'), 'color'), 'rgb(255, 255, 255)');
    assert(/1 1 1 \/ 0\.8|255, 255, 255, 0\.8/.test(css($(slide('layout-title', '<p class="subtitle">s</p>'), 'p'), 'color')), '.subtitle is 80% white');
    assert(/1 1 1 \/ 0\.6|255, 255, 255, 0\.6/.test(css($(slide('layout-title', '<p class="hint">s</p>'), 'p'), 'color')), '.hint is 60% white');
  });

  test('layouts: boxes use the colour variables, definition box differs', () => {
    const el = slide('layout-content', '<div class="layout-box">a</div><div class="layout-box layout-box-definition">b</div>');
    const [box, definition] = $$(el, '.layout-box');
    eq(css(box, 'borderLeftColor'), 'rgb(31, 78, 122)');
    eq(css(definition, 'borderLeftColor'), 'rgb(106, 76, 147)');
    document.documentElement.style.setProperty('--layout-primary', 'rgb(1, 2, 3)');
    try { eq(css(box, 'borderLeftColor'), 'rgb(1, 2, 3)'); } finally { document.documentElement.style.removeProperty('--layout-primary'); }
  });

  test('layouts: summary table, panel and legend', () => {
    const el = slide('layout-summary', '<h2>T</h2><div class="layout-panel"><p class="box-title">t</p><table><tr><th>a</th></tr><tr><td>b</td></tr></table></div>'
      + '<div class="layout-legend"><span><span class="layout-chip"></span>x</span></div>');
    eq(css($(el, 'th'), 'textAlign'), 'left');
    eq(css($(el, 'th'), 'borderBottomWidth'), '3px');
    eq(css($(el, '.layout-panel'), 'borderTopWidth'), '3px');
    eq(css($(el, '.layout-legend'), 'display'), 'flex');
    eq(css($(el, '.layout-chip'), 'display'), 'inline-block');
  });

  // ======================================================================
  // Integration with the real reveal.js
  // ======================================================================
  const deck = new Reveal(document.getElementById('integration'), {
    plugins: [RevealUncover, RevealProbability],
    probability: { labels: { venn: 'Mengendiagramm' } },
    uncover: { descriptions: { coverSlide: 'Lösungen dieser Folie verdecken' } }
  });
  deck.initialize().then(async () => {
    await testAsync('integration: plugins are registered', () => {
      assert(deck.getPlugin('uncover') && deck.getPlugin('probability'));
    });
    await testAsync('integration: diagrams are built before ready, config is read', () => {
      eq(document.querySelector('#i-venn svg').getAttribute('aria-label'), 'Mengendiagramm');
      eq(document.querySelectorAll('#i-ff th').length, 7);
    });
    await testAsync('integration: solutions start covered and toggle on click', () => {
      const a = document.getElementById('i-a'), b = document.getElementById('i-b');
      assert(a.classList.contains('covered') && b.classList.contains('covered'));
      a.click();
      assert(!a.classList.contains('covered') && b.classList.contains('covered'));
    });
    await testAsync('integration: a marked table value is covered by reveal-uncover and uncovers on click', () => {
      const value = document.querySelector('#i-ff td .uncover');
      assert(value && value.classList.contains('covered'), 'covered at start');
      eq(value.textContent, '1');
      value.click();
      assert(!value.classList.contains('covered'));
      value.click();
    });
    await testAsync('integration: keys U/V (slide) and Shift+U/Shift+V (all) work through reveal.js', () => {
      const covered = () => document.querySelectorAll('#integration .uncover.covered').length;
      const press = (key, keyCode, shiftKey = false) =>
        document.dispatchEvent(new KeyboardEvent('keydown', { key, keyCode, which: keyCode, shiftKey, bubbles: true }));
      deck.getPlugin('uncover').uncover();
      press('v', 86);
      eq(covered(), 3, 'V covers the current slide');
      press('u', 85);
      eq(covered(), 0, 'U uncovers it');
      press('V', 86, true);
      eq(covered(), 3, 'Shift+V covers all');
      press('U', 85, true);
      eq(covered(), 0, 'Shift+U uncovers all');
      deck.toggleHelp(true);
      const help = document.querySelector('.r-overlay-help-content')?.textContent ?? '';
      deck.toggleHelp(false);
      assert(help.includes('Shift + U') && help.includes('Lösungen dieser Folie verdecken'), 'listed in the keyboard help');
    });
    await testAsync('integration: no unexpected warnings', () => { eq(warnings, []); });
    finish();
  });

  function finish() {
    console.warn = nativeWarn;
    const failed = results.filter(r => !r.ok);
    document.getElementById('result').textContent = JSON.stringify({ total: results.length, failed: failed.length, results }, null, 1);
    document.body.dataset.done = 'true';
  }
})();
</script>
</body>
